name: Python application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          pip install "mypy==1.19.1" "ruff==0.14.1" pytest meson-python meson ninja pybind11

      - name: Install ta-lib
        run: |
          python -m pip install "ta-lib==0.6.4" --index-url https://pypi.vnpy.com
          python -m pip install "vnpy==4.4.0"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy vnpy_hts

      - name: Install Visual C++ 2013 runtime
        run: |
          curl.exe -fsSL -o "$env:RUNNER_TEMP\vcredist2013_x64.exe" https://download.microsoft.com/download/2/E/6/2E61CFA4-993B-4DD4-91DA-3737CD5CD6E3/vcredist_x64.exe
          Start-Process -FilePath "$env:RUNNER_TEMP\vcredist2013_x64.exe" -ArgumentList "/install","/quiet","/norestart" -Wait

      - name: Build and install
        run: |
          pip install -e . --no-build-isolation --config-settings=build-dir=build

      - name: Import extension
        run: python -c "import vnpy_hts.api"

      - name: Test
        run: python -m pytest tests
